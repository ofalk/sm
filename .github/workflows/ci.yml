name: CI

# Run on main (release) and devel (integration) pushes, and on PRs targeting
# either. Merging devel into main additionally requires a green pipeline via
# branch protection on main (required checks: the matrix legs).
on:
  push:
    branches: [ main, devel ]
  pull_request:
    branches: [ main, devel ]

# Least privilege by default; the deploy job overrides this with contents: write.
permissions:
  contents: read

jobs:
  # Cheap, blocking guard: the interpreter the production image ships must be
  # one a test leg actually runs. Added after a `build(deps)` bump of the
  # Dockerfile base to python:3.15-slim landed green while the matrix tested
  # only 3.13/3.14.
  docker-base-in-matrix:
    name: docker base is a tested interpreter
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Assert the image's Python base is covered by the test matrix
      run: python3 .github/scripts/check_docker_base_in_matrix.py

  test:
    runs-on: ubuntu-latest

    strategy:
      # All legs must pass. 3.15 is the canonical/base interpreter and matches
      # the production Docker image. 3.14 is the previous stable line and 3.13
      # remains for PEP 649 annotation checks: it is the last interpreter that
      # evaluates annotations eagerly, so a 3.14+-only leg cannot see
      # self-referential annotation defects. fail-fast is off so one red leg
      # cannot hide another's result, and every leg runs the identical recipe
      # below so the versions cannot drift apart.
      fail-fast: false
      matrix:
        python-version: ['3.15', '3.14', '3.13']

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: sm_db
          POSTGRES_USER: sm_user
          POSTGRES_PASSWORD: sm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        # Only the browsers the browser tests actually use (skips WebKit)
        playwright install chromium firefox --with-deps

    - name: Verify runtime versions
      env:
        EXPECTED_PYTHON: ${{ matrix.python-version }}
      run: |
        python - <<'PY'
        import os
        import sys

        import django

        expected = tuple(int(part) for part in os.environ["EXPECTED_PYTHON"].split(".")[:2])
        assert sys.version_info[:2] == expected, (
            f"expected Python {expected}, got {sys.version_info[:2]}"
        )
        assert django.VERSION[:2] == (6, 1), (
            f"expected Django 6.1.x, got {django.get_version()}"
        )
        print("Python:", sys.version)
        print("Django:", django.get_version())
        PY

    - name: Run Tests
      env:
        DATABASE_URL: postgresql://sm_user:sm_password@localhost:5432/sm_db
        SECRET_KEY: ci-secret-key
        DEBUG: False
        ALLOWED_HOSTS: "*"
      run: |
        cd sm
        python manage.py collectstatic --noinput
        coverage run manage.py test -v3 --exclude-tag=browser
        coverage report --fail-under=85
        coverage html

    - name: Run Browser Tests
      env:
        DATABASE_URL: postgresql://sm_user:sm_password@localhost:5432/sm_db
        SECRET_KEY: ci-secret-key
        DEBUG: False
        ALLOWED_HOSTS: "*"
      run: |
        cd sm
        python manage.py test -v2 --tag=browser

    - name: Run Pycco
      run: |
        find sm/ -type f -name "*.py"|grep -v __pycache__|grep -v __init__.py|grep -v /migrations/ | xargs pycco -p -d pycco -i -s

    # Uploaded from the canonical leg only: the Pages `deploy` job below downloads the
    # artifact by this exact name, and `upload-artifact@v4` requires unique names, so a
    # second leg uploading the same name would fail the job rather than merge the reports.
    - name: Upload coverage reports
      if: matrix.python-version == '3.15'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report
        path: sm/htmlcov/

    - name: Upload pycco documentation
      if: matrix.python-version == '3.15'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: pycco-docs
        path: pycco/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: public/coverage

      - name: Download pycco documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pycco-docs
          path: public/pycco

      - name: Create index.html
        run: |
          mkdir -p public
          cat > public/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>ServerManager (SM)</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
                      min-height: 100vh;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      color: #fff;
                  }
                  .container {
                      text-align: center;
                      padding: 3rem;
                      background: rgba(255,255,255,0.05);
                      border-radius: 20px;
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,255,255,0.1);
                      max-width: 600px;
                  }
                  h1 {
                      font-size: 3.5rem;
                      font-weight: 700;
                      margin-bottom: 0.5rem;
                      background: linear-gradient(90deg, #00d9ff, #00ff88);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      background-clip: text;
                  }
                  .subtitle {
                      font-size: 1.3rem;
                      color: #8892b0;
                      margin-bottom: 2.5rem;
                  }
                  .links {
                      display: flex;
                      gap: 1rem;
                      justify-content: center;
                      flex-wrap: wrap;
                  }
                  .link-card {
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      padding: 1.5rem 2rem;
                      background: rgba(255,255,255,0.08);
                      border-radius: 12px;
                      text-decoration: none;
                      color: #fff;
                      transition: all 0.3s ease;
                      border: 1px solid rgba(255,255,255,0.1);
                      min-width: 180px;
                  }
                  .link-card:hover {
                      transform: translateY(-5px);
                      background: rgba(255,255,255,0.15);
                      border-color: #00d9ff;
                  }
                  .link-icon {
                      font-size: 2rem;
                      margin-bottom: 0.5rem;
                  }
                  .link-title {
                      font-weight: 600;
                      font-size: 1.1rem;
                  }
                  .link-desc {
                      font-size: 0.85rem;
                      color: #8892b0;
                      margin-top: 0.3rem;
                  }
                  .footer {
                      margin-top: 3rem;
                      color: #4a5568;
                      font-size: 0.85rem;
                  }
                  .github-link {
                      color: #00d9ff;
                      text-decoration: none;
                      font-weight: 600;
                  }
                  .github-link:hover {
                      text-decoration: underline;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>ServerManager (SM)</h1>
                  <p class="subtitle">Open Source Server Management System</p>
                  <div class="links">
                      <a href="coverage/" class="link-card">
                          <span class="link-icon">📊</span>
                          <span class="link-title">Coverage</span>
                          <span class="link-desc">Test coverage report</span>
                      </a>
                      <a href="pycco/" class="link-card">
                          <span class="link-icon">📚</span>
                          <span class="link-title">Pycco</span>
                          <span class="link-desc">API documentation</span>
                      </a>
                  </div>
                  <p class="footer">
                      <a href="https://github.com/ofalk/sm" class="github-link">View on GitHub</a> · Powered by Django &amp; GitHub Actions
                  </p>
              </div>
          </body>
          </html>
          HTMLEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
