apiVersion: apps/v1
kind: Deployment
metadata:
  name: sm
  namespace: localghost
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sm
  template:
    metadata:
      labels:
        app: sm
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/ofalk/sm:adf1b797e393ca9ac369f94e193290591f22bc0f
          command: ["/app/entrypoint.sh", "migrate"]
          envFrom:
            - secretRef:
                name: sm-secrets
            - configMapRef:
                name: sm-config
        - name: loaddata
          image: ghcr.io/ofalk/sm:adf1b797e393ca9ac369f94e193290591f22bc0f
          command: ["/app/entrypoint.sh", "loaddata"]
          envFrom:
            - secretRef:
                name: sm-secrets
            - configMapRef:
                name: sm-config
        - name: ensure-admin
          image: ghcr.io/ofalk/sm:adf1b797e393ca9ac369f94e193290591f22bc0f
          command: ["/app/entrypoint.sh", "ensure_admin"]
          envFrom:
            - secretRef:
                name: sm-secrets
            - configMapRef:
                name: sm-config
        - name: collectstatic
          image: ghcr.io/ofalk/sm:adf1b797e393ca9ac369f94e193290591f22bc0f
          command: ["/app/entrypoint.sh", "collectstatic"]
          envFrom:
            - secretRef:
                name: sm-secrets
            - configMapRef:
                name: sm-config
          volumeMounts:
            - name: static-assets
              mountPath: /app/sm/static
      containers:
        - name: sm
          image: ghcr.io/ofalk/sm:adf1b797e393ca9ac369f94e193290591f22bc0f
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: sm-secrets
            - configMapRef:
                name: sm-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: sm.localghost.com
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: sm.localghost.com
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: static-assets
              mountPath: /app/sm/static
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 8080
              name: caddy-http
          volumeMounts:
            - name: static-assets
              mountPath: /app/sm/static
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
      volumes:
        - name: static-assets
          emptyDir: {}
        - name: caddy-config
          configMap:
            name: sm-caddy-config
