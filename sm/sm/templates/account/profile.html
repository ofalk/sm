{% extends "account/base.html" %}
{% load i18n %}
{% load django_bootstrap5 %}

{% block head_title %}{% trans "Profile" %}{% endblock %}

{% block account_content %}
<div class="card-header">
    <h5>{% trans "Your Profile" %}</h5>
</div>
<div class="card-body p-4">
    <form method="post" action="{% url 'profile' %}" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        <div class="form-actions justify-content-end">
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-check me-1"></i> {% trans "Save Changes" %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
