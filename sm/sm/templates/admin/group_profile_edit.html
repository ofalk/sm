{% extends "site_base.html" %}
{% load i18n %}
{% load bootstrap4 %}

{% block head_title %}{% trans "Edit Group Quotas" %}{% endblock %}

{% block body %}
<div class="wide-container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">{% trans "Edit Quotas for" %} {{ object.group.name }}</h4>
                </div>
                <div class="card-body">
                    <form method="post" class="form">
                        {% csrf_token %}
                        {% bootstrap_form form %}
                        <div class="form-group mt-4">
                            <button type="submit" class="btn btn-primary pill">
                                <i class="fa-solid fa-save mr-1"></i> {% trans "Save Changes" %}
                            </button>
                            <a href="{% url 'user_management_list' %}" class="btn btn-link text-muted">
                                {% trans "Cancel" %}
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
