{% load i18n %}
<form method="post" action="{{ toggle_url }}" class="monitoring-toggle"
      data-monitoring-toggle
      data-error-message="{% trans 'Could not update monitoring. Please try again.' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url|default:request.path }}">
    <button type="submit"
            id="monitoring-toggle-{{ object.pk }}"
            class="monitoring-switch {% if is_monitored %}is-on{% else %}is-off{% endif %}"
            role="switch"
            aria-checked="{% if is_monitored %}true{% else %}false{% endif %}"
            aria-label="{% trans 'Toggle monitoring' %}"
            data-on-label="{% trans 'On' %}"
            data-off-label="{% trans 'Off' %}"
            {% if not can_toggle %}disabled{% endif %}>
        <span class="monitoring-switch-track" aria-hidden="true">
            <span class="monitoring-switch-icon monitoring-switch-icon-on">
                <i class="fa-solid fa-check"></i>
            </span>
            <span class="monitoring-switch-icon monitoring-switch-icon-off">
                <i class="fa-solid fa-xmark"></i>
            </span>
            <span class="monitoring-switch-thumb"></span>
        </span>
        <span class="monitoring-switch-text{% if not show_label %} visually-hidden{% endif %}">
            <span class="monitoring-switch-title">{% trans "Monitoring" %}</span>
            <span class="monitoring-switch-state">
                {% if is_monitored %}{% trans "On" %}{% else %}{% trans "Off" %}{% endif %}
            </span>
        </span>
    </button>
</form>
