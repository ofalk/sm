{% load i18n %}
<form method="post" action="{{ toggle_url }}" class="monitoring-toggle">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url|default:request.path }}">
    {% if show_label %}<span class="monitoring-toggle-label">{% trans "Monitoring" %}</span>{% endif %}
    <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" role="switch"
               id="monitoring-toggle-{{ object.pk }}"
               {% if is_monitored %}checked{% endif %}
               {% if not can_toggle %}disabled{% endif %}
               onchange="this.form.submit()"
               aria-label="{% trans 'Toggle monitoring' %}">
        <label class="form-check-label" for="monitoring-toggle-{{ object.pk }}">
            {% if is_monitored %}{% trans "On" %}{% else %}{% trans "Off" %}{% endif %}
        </label>
    </div>
</form>
